<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LojikGain Founder's Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.vault{background:rgba(255,255,255,0.05);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:48px;width:400px;text-align:center}
.vault h1{font-size:28px;font-weight:600;margin-bottom:8px}
.vault p{color:#888;font-size:14px;margin-bottom:32px}
.vault input{width:100%;padding:14px 16px;margin-bottom:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:#fff;font-size:16px;outline:none}
.vault input:focus{border-color:#0071e3}
.vault button{width:100%;padding:14px;background:#0071e3;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.vault button:hover{background:#0077ed}
.vault .err{color:#ff453a;font-size:13px;margin-top:12px;display:none}
.vault .lock{font-size:48px;margin-bottom:16px}
</style>
</head>
<body>
<div class="vault" id="vault">
  <div class="lock">&#128274;</div>
  <h1>LojikX Vault</h1>
  <p>Founder's Edition - AES-256-GCM Encrypted</p>
  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button id="unlockBtn">Unlock Vault</button>
  <div class="err" id="err">Invalid credentials - AES-256 vault locked</div>
</div>
<div id="content" style="display:none"></div>
<script>
const PBKDF2_ITER = 100000;
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:PBKDF2_ITER, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decryptWithKey(env, key) {
  const iv = Uint8Array.from(atob(env.iv), c=>c.charCodeAt(0));
  const ct = Uint8Array.from(atob(env.ct), c=>c.charCodeAt(0));
  const dec = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct);
  let data = new Uint8Array(dec);
  if (env.gz) {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    writer.write(data);
    writer.close();
    const reader = ds.readable.getReader();
    const chunks = [];
    while (true) { const r = await reader.read(); if (r.done) break; chunks.push(r.value); }
    const total = chunks.reduce((a,c)=>a+c.length,0);
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    data = out;
  }
  return new TextDecoder().decode(data);
}
document.getElementById('unlockBtn').addEventListener('click', async () => {
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    const [bundleRes, dataRes] = await Promise.all([fetch('founder_bundle.enc'), fetch('founder_data.enc')]);
    const bundleEnv = await bundleRes.json();
    const dataEnv = await dataRes.json();
    const salt = Uint8Array.from(atob(bundleEnv.s), c=>c.charCodeAt(0));
    const key = await deriveKey(email + ':' + pass, salt);
    const bundleText = await decryptWithKey(bundleEnv, key);
    const dsalt = Uint8Array.from(atob(dataEnv.s), c=>c.charCodeAt(0));
    const dkey = await deriveKey(email + ':' + pass, dsalt);
    const dataText = await decryptWithKey(dataEnv, dkey);
    window.FOUNDER_DATA = JSON.parse(dataText);
    const content = document.getElementById('content');
    content.innerHTML = bundleText;
    document.getElementById('vault').style.display = 'none';
    content.style.display = 'block';
    const scripts = content.querySelectorAll('script');
    scripts.forEach(s => {
      const ns = document.createElement('script');
      ns.textContent = s.textContent;
      document.body.appendChild(ns);
    });
  } catch (e) {
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
